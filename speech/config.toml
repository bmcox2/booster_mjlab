# Which provider/model each stage uses. Switching the LLM = change [llm] here.

[audio]
input_device = "pipewire"    # PortAudio only sees ALSA names; choose the headset in GNOME Sound settings
output_device = "pipewire"
sample_rate = 16000          # Whisper wants 16 kHz mono

[vad]
# Hands-free listening (speech/src/speech/vad.py). Times in milliseconds.
threshold = 0.5              # Silero speech probability that starts an utterance
neg_threshold = 0.35         # once speaking, below this counts as silence (hysteresis)
smart_turn = true            # ask Smart Turn v3.2 whether you're finished (false = silence rule only)
smart_turn_check_ms = 200    # pause length that triggers the question
smart_turn_recheck_ms = 300  # while the pause lasts, ask again this often
smart_turn_threshold = 0.8   # probability that counts as "finished" (0.5 cut the test-set ramble at a 0.77 pause)
smart_turn_strict_threshold = 0.95  # ...but during the first strict_ms of a pause, only this counts
smart_turn_strict_ms = 800   # 2026-11-11: "talking about" 0.81, "gave up and" 0.84 cut people off at 0.8
smart_turn_max_silence_ms = 2000  # if it says "not finished", end anyway after this much silence
silence_ms = 600             # without Smart Turn: this much silence = your turn is over
min_speech_ms = 250          # shorter bursts are treated as noise (clicks, coughs)
preroll_ms = 300             # audio kept from just before speech started
max_utterance_s = 30         # force a turn end after this long
echo_tail_ms = 300           # after the robot speaks, ignore the mic this long (speaker ring-out)

[stt]
provider = "groq"            # "groq" (cloud, ~0.3 s) or "local" (this laptop, ~1.6 s on CPU)
fallback = "local"           # used when the provider fails (no internet, rate limit); "" = none
# Hint words: Whisper spells these right more often when it sees them first (max ~200 words).
prompt = "Booster K1 robot, Booster Lab, SIGRobotics club, mjlab, Groq."

[stt.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "whisper-large-v3-turbo"  # test set 2026-11-08: 3.8% word errors vs 9.1% for whisper-large-v3, same speed

[stt.local]
model = "small.en"           # try "large-v3-turbo" once the GPU is back
device = "cpu"               # "cuda" when nvidia-smi works
compute_type = "int8"        # "float16" on GPU

[llm]
provider = "groq"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model = "qwen/qwen3.8-27b"    # 2026-11-10: keeps to the length limit (12.5 words median, max 20 on live test 2);
                             # gpt-oss-20b ignored it (16.5 / 44). Also: openai/gpt-oss-20b, openai/gpt-oss-120b
# reasoning_effort = "low"   # only for the gpt-oss models (they think before answering)
max_tokens = 400             # 2026-11-11: without a cap Groq assumed a 1,272-token reply and refused qwen3.8-27b
                             # (free tier: 1,000 output tokens/min). Replies are ~40 tokens; room left for thinking
system_prompt = """You are a friendly robot talking out loud. Reply in plain spoken English, \
at most 2 short sentences and under 30 words, like a person chatting. Start with a few short words. \
No markdown, lists, dashes, emojis, or symbols that can't be spoken."""

[stream]
# Step 4: speak the reply in pieces while the rest is still being written and voiced.
enabled = true
first_min_words = 2          # first piece: cut at the first comma / sentence end after 2+ words (1 left gaps)
min_words = 6                # later pieces: 6+ words (shorter pieces leave gaps: Kokoro can't keep up)
max_words = 25               # cut a long stretch without punctuation anyway
sentence_pause_ms = 300      # pause between pieces after . ! ? (Kokoro's own padding is trimmed)
clause_pause_ms = 150        # pause after , ; :

[tts]
engine = "kokoro"
voice = "bm_daniel"          # British male; picked 2026-11-08 from `uv run python -m speech.voices`
sample_rate = 24000          # Kokoro's output rate
device = "cpu"               # "cuda" when the GPU is back
cpu_threads = 4              # fastest on this laptop's CPU (notes/speech_bench.md); default was 14

[gesture]
# notes/gesture_plan.md steps 6-7: K1 motion for each reply, from a service in the main repo. Which
# one is running decides what happens (the loop asks it at start):
#   `uv run gesture live`   the K1 gestures live in a MuJoCo window; each piece of the reply is sent as
#                           it is voiced, with the moment it will play
#   `uv run gesture serve`  offline: after each reply, its motion is written to <turn>/gesture/
# Sent from background threads: never delays the conversation.
enabled = true
url = "http://127.0.0.1:8765"
timeout_s = 60
