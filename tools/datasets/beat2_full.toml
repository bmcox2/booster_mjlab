# Full BEAT2 tracker dataset (plan: "K1 Co-Speech Gesture: Full BEAT2 Dataset Plan", 2026-10-18;
# decisions: notes/log.md 2026-10-18).
#
#   uv run python tools/beat2_batch.py --spec tools/datasets/beat2_full.toml --stages segment   # human side only
#   uv run python tools/beat2_batch.py --spec tools/datasets/beat2_full.toml                    # everything, then upload
#
# Paths starting with ~ are expanded; relative paths are relative to the repo.

name = "beat2-full-torso"                            # artifacts: <name>-<set>, e.g. beat2-full-torso-train-a
beat2_dir = "~/robotics/data/BEAT2/beat_english_v2.0.0"
out_dir = "~/robotics/data/beat2_full_torso"         # per-clip cache; one folder per spec + IK config
# GMR K1 IK config. Torso config (Trunk <- spine1) until the v3 config exists; then set it here,
# use a new out_dir and name, and rerun.
ik_config = "tools/ik_configs/smplx_to_k1_torso.json"
segments_report = "notes/beat2-full-segments.md"
qc_report = "notes/beat2-full-qc.md"

[speakers]
# Held out entirely (6). Nidal and Ayana (4-hour speakers, per the plan); 20_li (M) and 27_yingqing (F)
# gesture like the training median (arms 21 / 24 cm/s vs 22) and shift their feet like it; 5_stewart (M)
# and 10_kieks (F), the only ~1-hour native speakers, are calm (15 cm/s) but nearly free to hold out
# (7 train takes each, 15 test + 8 val). Read held-out results per speaker.
# Genders from the BEAT paper's speaker table (arXiv 2203.05297, Table 9).
heldout = ["11_nidal", "21_ayana", "20_li", "27_yingqing", "5_stewart", "10_kieks"]
train = "rest"                                       # every other speaker in train_test_split.csv (or a list)
skip = []                                            # speakers left out of both groups

[segments]                                           # see tools/beat2_segments.py
tier_a_cm = 10.0
tier_b_cm = 25.0
min_s = 4.0
max_s = 20.0
shift_pad_s = 2.0
move_speed = 0.10

# One combined file per set. speakers: "train" or "heldout"; takes: official split types
# (train / val / test / additional = the 10-min session-1 conversations); tiers: "A" (still) and/or
# "B" (foot shifts, names end in _shift). Training sets may only use train / additional takes.
# Comparison runs: train-a alone, and train-a + train-b (combine-motions the two artifacts).
[sets.train-a]
speakers = "train"
takes = ["train", "additional"]
tiers = ["A"]

[sets.train-b]
speakers = "train"
takes = ["train", "additional"]
tiers = ["B"]

[sets.train-ab]                                      # A + B in one file: the data the final run uses
speakers = "train"                                   # (A+B won the 10-19 comparison, notes/log.md)
takes = ["train", "additional"]
tiers = ["A", "B"]

[sets.val]                                           # picks the checkpoint
speakers = "train"
takes = ["val"]
tiers = ["A", "B"]

[sets.heldout-val]
speakers = "heldout"
takes = ["val"]
tiers = ["A", "B"]

[sets.test]                                          # scored once, at the end
speakers = "train"
takes = ["test"]
tiers = ["A", "B"]

[sets.heldout-test]
speakers = "heldout"
takes = ["test"]
tiers = ["A", "B"]

[sets.heldout-conv]                                  # unseen people in conversation (session 1)
speakers = "heldout"
takes = ["additional"]
tiers = ["A", "B"]

[qc]                                                 # Gate 1 limits; defaults and meaning in tools/clip_qc.py
exclude = "severe"                                   # none / severe / flagged
# Clips Gate 1 passes but both 10-19 full-BEAT2 policies (wbitlbqw, 1de2pner) fail at the same second,
# 0-19/20 rollouts (notes/log.md 2026-10-20). Mostly extreme arm-joint speed (shoulder near singular?),
# broken leg retargets, Katya's toe-resting leg. 3 of them are also caught by the new foot rules.
exclude_clips = [
    "carla_0_57_57_t18-26", "itoi_0_7_7_t61-76_shift", "katya_0_66_66_t20-40", "katya_1_2_2_t429-434_shift",
    "katya_1_2_2_t89-95", "lawrence_0_101_101_t42-55", "lawrence_0_98_98_t26-36_shift", "lawrence_0_98_98_t41-45",
    "lawrence_1_10_10_t127-133_shift", "miranda_1_1_1_t79-94", "scott_0_91_91_t37-44_shift",
    "scott_1_1_1_t254-260_shift", "scott_1_2_2_t182-187_shift", "scott_1_3_3_t277-281_shift", "scott_1_4_4_t136-143",
    "scott_1_6_6_t286-293_shift", "solomon_0_23_23_t17-30_shift", "solomon_0_56_56_t15-30", "wayne_0_33_33_t4-9_shift",
]
