# Full BEAT2 tracker dataset (plan: "K1 Co-Speech Gesture: Full BEAT2 Dataset Plan", 2026-10-18).
#
#   uv run python tools/beat2_batch.py --spec tools/datasets/beat2_full.toml --stages segment   # phase 1: human side
#   uv run python tools/beat2_batch.py --spec tools/datasets/beat2_full.toml                    # everything, then upload
#
# Paths starting with ~ are expanded; relative paths are relative to the repo.

name = "beat2-full"                                  # artifacts: <name>-<set>, e.g. beat2-full-train
beat2_dir = "~/robotics/data/BEAT2/beat_english_v2.0.0"
out_dir = "~/robotics/data/beat2_full"               # per-clip cache; one folder per spec
ik_config = ""                                       # GMR K1 IK config (phase 2: the v3 config). "" = GMR's default
segments_report = "notes/beat2-full-segments.md"
qc_report = "notes/beat2-full-qc.md"

[speakers]
# Held out entirely: the plan's two 4-hour speakers + one man and one woman from the ~1-hour speakers.
# 20_li (M) and 27_yingqing (F) gesture like the training median (arms 21 / 24 cm/s vs 22) and shift
# their feet like it (13-20% of time lost); 5_stewart / 10_kieks were the other candidates (most eval
# takes) but are calm (15 cm/s, still feet) like Nidal, which would make the held-out test easy.
# Genders from the BEAT paper's speaker table (arXiv 2203.05297, Table 9).
heldout = ["11_nidal", "21_ayana", "20_li", "27_yingqing"]
train = "rest"                                       # every other speaker in train_test_split.csv (or a list)
skip = []                                            # speakers left out of both groups

[segments]                                           # see tools/beat2_segments.py
tier_a_cm = 10.0
tier_b_cm = 25.0
min_s = 4.0
max_s = 20.0
shift_pad_s = 2.0
move_speed = 0.10

# One combined artifact per set. speakers: "train" or "heldout"; takes: official split types
# (train / val / test / additional); tiers: "A" (still) and/or "B" (foot shifts, names end in _shift).
# Tier B goes into training only once its foot checks pass (plan, decision 7).
[sets.train]
speakers = "train"
takes = ["train"]
tiers = ["A"]

[sets.train-shift]
speakers = "train"
takes = ["train"]
tiers = ["B"]

[sets.val]                                           # picks the checkpoint
speakers = "train"
takes = ["val"]
tiers = ["A"]

[sets.heldout-val]
speakers = "heldout"
takes = ["val"]
tiers = ["A"]

[sets.test]                                          # scored once, at the end
speakers = "train"
takes = ["test"]
tiers = ["A"]

[sets.heldout-test]
speakers = "heldout"
takes = ["test"]
tiers = ["A"]

[qc]                                                 # Gate 1 limits; defaults and meaning in tools/clip_qc.py
exclude = "severe"                                   # none / severe / flagged
